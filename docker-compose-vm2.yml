services:
  app:
    image: ${IMAGE:-kirandhakal/contact-backend}:${IMAGE_TAG:-latest}
    container_name: contact-backend-vm2
    restart: unless-stopped
    init: true

    env_file:
      - .env.docker

    ports:
      - "127.0.0.1:3100:3100"

    mem_limit: 350m
    cpus: 1.0

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3100/health/live', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"